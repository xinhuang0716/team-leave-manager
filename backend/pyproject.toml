[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "backend"
version = "1.0.4"
description = "Backend API for managing team leave records"
requires-python = ">=3.12"
dependencies = [
    "cloudflare>=5.7.0",
    "fastapi>=0.141.1",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.53.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
